<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HR Circuit ligature logo, dark variant">
  <title>Humanoid Robotics — HR Circuit (dark)</title>
  <defs>
    <filter id="glowCD" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>
  <!-- neon underglow -->
  <g fill="none" stroke="#2DD4BF" stroke-width="6" opacity="0.45" filter="url(#glowCD)" stroke-linejoin="miter">
    <path d="M12 16 V48"/>
    <path d="M26 16 V48"/>
    <path d="M12 32 H26"/>
    <path d="M26 16 H38 L42 20 V28 L38 32 H26"/>
    <path d="M31 32 L43 48"/>
  </g>
  <!-- fine white traces; crossbar and bowl bottom share the shoulder line y=32 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="miter">
    <path d="M12 16 V48"/>
    <path d="M26 16 V48"/>
    <path d="M12 32 H26"/>
    <path d="M26 16 H38 L42 20 V28 L38 32 H26"/>
    <path d="M31 32 L43 48"/>
  </g>
  <!-- neon via pads at the joints -->
  <g fill="none" stroke="#2DD4BF" stroke-width="2">
    <circle cx="12" cy="16" r="2.4"/>
    <circle cx="26" cy="16" r="2.4"/>
    <circle cx="43" cy="48" r="2.4"/>
  </g>
</svg>
