<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Physical AI and Humanoid Robotics">
  <title>Physical AI &amp; Humanoid Robotics</title>
  <!-- antenna: amber dot, the one warm accent -->
  <circle cx="32" cy="7" r="3.5" fill="#F59E0B"/>
  <line x1="32" y1="11" x2="32" y2="16" stroke="#2DD4BF" stroke-width="2.5"/>
  <!-- badge: viewport navy, carries its own background -->
  <rect x="6" y="16" width="52" height="42" rx="12" fill="#0A1526"/>
  <!-- eyes: signal teal -->
  <circle cx="22" cy="31" r="4.5" fill="#2DD4BF"/>
  <circle cx="42" cy="31" r="4.5" fill="#2DD4BF"/>
  <!-- mouth: the Signal Path, an oscilloscope trace -->
  <path d="M14 44 H24 l4 -8 5 16 4 -8 H50" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
