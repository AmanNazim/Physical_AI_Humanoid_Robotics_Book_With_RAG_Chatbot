<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Engineered visor head logo, light variant">
  <title>Physical AI &amp; Humanoid Robotics — visor head (light)</title>
  <!-- antenna: one amber accent -->
  <circle cx="32" cy="8" r="3" fill="#F59E0B"/>
  <line x1="32" y1="12" x2="32" y2="18" stroke="#0E7490" stroke-width="2.5"/>
  <!-- helmet: stroke construction, not a filled blob -->
  <rect x="12" y="18" width="40" height="36" rx="10" fill="none" stroke="#0E7490" stroke-width="3"/>
  <!-- visor: a single bar, not a cute face -->
  <rect x="19" y="26" width="26" height="7" rx="3.5" fill="#0E7490"/>
  <!-- the Signal Path, small and precise -->
  <path d="M20 44 H27 l2.5 -5 3 10 2.5 -5 H44" fill="none" stroke="#0E7490" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
